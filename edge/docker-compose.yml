services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: appitect-mini-caddy-waf:latest
    container_name: appitect-mini-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - vps_edge

networks:
  vps_edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
